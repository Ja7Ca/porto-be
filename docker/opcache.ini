opcache.enable=1
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.save_comments=1

; validate_timestamps=0 berarti Opcache TIDAK cek perubahan file di runtime.
; Ini benar untuk kita karena deploy = rebuild image baru + restart container
; (bukan edit file langsung di container yang sedang jalan). Kalau kamu nanti
; exec masuk container dan edit file manual untuk debug cepat, perubahan itu
; TIDAK akan kepakai sampai container di-restart -- ini bukan bug, ini konsekuensi
; sadar dari setting ini.
opcache.validate_timestamps=0