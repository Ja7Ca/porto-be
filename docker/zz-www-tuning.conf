; File ini di-load SETELAH www.conf default milik image resmi php-fpm,
; karena urutan load file di /usr/local/etc/php-fpm.d/ itu alfabetis dan
; "zz-" sengaja dibuat supaya paling akhir -> directive di sini override yang default.
; Tidak perlu redefine seluruh pool [www], cukup directive yang mau diubah.

[www]
pm = dynamic
pm.max_children = 3
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2

; Recycle worker tiap 500 request -> mitigasi memory bloat perlahan
; (bukan state-leak seperti Octane, tapi tetap praktik sehat untuk FPM jangka panjang)
pm.max_requests = 500